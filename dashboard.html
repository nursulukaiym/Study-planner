<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Planner — Тапсырмалар</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="nav"><a class="brand" href="index.html">📚 Study Planner</a><nav><a href="index.html">Басты бет</a><a href="login.html">Кіру</a><a class="active" href="dashboard.html">Жоспарым</a></nav></header><main class="dashboard"><div class="dash-heading"><div><span class="eyebrow">Менің оқу кеңістігім</span><h1>Тапсырмаларым ✨</h1><p>Бүгінгі мақсатыңа бір қадам жақында!</p></div><div class="date-pill" id="today"></div></div><div class="stats"><div class="stat"><span>Барлық тапсырма</span><strong id="totalCount">0</strong></div><div class="stat"><span>Орындалған</span><strong id="doneCount">0</strong></div><div class="stat"><span>Қалғаны</span><strong id="pendingCount">0</strong></div></div><div class="dashboard-grid"><section class="panel"><h2>➕ Жаңа тапсырма</h2><form id="taskForm"><label>Тапсырма атауы<input id="taskTitle" required maxlength="100" placeholder="Мысалы: Python зертханалық жұмыс"></label><label>Пән<input id="taskSubject" required maxlength="60" placeholder="Мысалы: Бағдарламалау"></label><label>Орындалу күні<input id="taskDate" type="date" required></label><button class="btn full" type="submit">Тапсырманы қосу</button></form></section><section class="panel"><div class="list-heading"><h2>📋 Тапсырмалар тізімі</h2><select id="filter" aria-label="Тапсырмаларды сүзу"><option value="all">Барлығы</option><option value="pending">Орындалмаған</option><option value="done">Орындалған</option></select></div><div id="taskList" class="task-list"></div><p class="note">Тапсырмалар осы браузерде сақталады (localStorage).</p></section></div></main><footer>© 2026 Study Planner · Оқу жобасы</footer><script src="assets/app.js"></script></body></html>
